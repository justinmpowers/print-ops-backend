name: Security scan

# Code patterns (Semgrep), secrets in git history (gitleaks), dependencies (pip-audit) and the
# Docker image's OS and Python packages (Grype). Runs on pull requests and main, and weekly so
# newly published advisories show up even when the code hasn't changed. Semgrep and Grype results
# go to the Security tab (code scanning), which tracks them and flags new ones on pull requests.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'   # Mondays 07:23 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned by digest as well as tag: tags can be moved (as with trivy-action in March 2026).
  SEMGREP_IMAGE: docker.io/semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  GRYPE_IMAGE: docker.io/anchore/grype:v0.122.1@sha256:661583704a253c0448ed63998b5ea2cd9d5a76ee71eedc4aed439b8ce3e93a1c
  # Pull request results are filed under the PR's head commit, as CodeQL files its own. GitHub
  # recreates a PR's test merge commit from time to time, and results filed under an old one would
  # leave the code-scanning merge rule waiting for results that never come.
  SCAN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SCAN_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}

jobs:
  semgrep:
    name: Code (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload results to code scanning
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.SCAN_SHA }}

      - name: Scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off \
            --config p/python --config p/flask --config p/typescript --config p/javascript \
            --config p/dockerfile --config p/github-actions --config p/secrets --config p/owasp-top-ten \
            --sarif --output semgrep.sarif
          # Semgrep keeps findings silenced with nosemgrep in its SARIF, marked as suppressed, and
          # code scanning opens alerts for them anyway, so drop them before uploading.
          jq '.runs[].results |= map(select((.suppressions // []) | length == 0))' semgrep.sarif > semgrep.tmp
          mv semgrep.tmp semgrep.sarif

      - name: Upload to code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: semgrep.sarif
          category: semgrep
          ref: ${{ env.SCAN_REF }}
          sha: ${{ env.SCAN_SHA }}

  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0   # the whole history, not just the latest commit

      # Fails on any finding not listed in .gitleaksignore. Secret values are redacted in the log.
      - name: Scan git history
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE"
          git /repo --no-banner --redact --verbose

  dependencies:
    name: Dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.15"   # matches the Dockerfile base image

      # Resolves the requirements (with their own dependencies) and fails on any known advisory.
      - name: Audit requirements
        run: |
          python -m pip install --quiet --disable-pip-version-check pip-audit==2.10.1
          pip-audit --progress-spinner off -r requirements.txt -r requirements-dev.txt

  image:
    name: Docker image (Grype)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload results to code scanning
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.SCAN_SHA }}

      # Scanned from a saved tarball, so the scanner never gets the Docker socket.
      - name: Build image
        run: docker build -t scan-target . && docker save scan-target -o image.tar

      # Fails on high or critical vulnerabilities that have a fix available.
      - name: Scan image
        run: >-
          docker run --rm -v "$PWD:/work" "$GRYPE_IMAGE"
          docker-archive:/work/image.tar --only-fixed --fail-on high
          -o table -o sarif=/work/grype.sarif

      - name: Upload to code scanning
        if: always() && hashFiles('grype.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: grype.sarif
          category: grype-image
          ref: ${{ env.SCAN_REF }}
          sha: ${{ env.SCAN_SHA }}
