# Weekly pull requests that keep dependencies current. Security fixes don't wait for this schedule:
# Dependabot security updates (on in the repository settings) open those as soon as an advisory lands.
# Not covered: the scanner images pinned by digest in workflows/security-scan.yml; bump those by hand.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # The Dockerfile's python:X-slim base image.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Actions are pinned to commit SHAs; Dependabot updates the SHA and its version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
